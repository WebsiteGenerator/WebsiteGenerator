<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>WebsiteGenerator</title>
  <meta name="description" content="lol.py, a Python script from 2021 that builds your personal website, running in your browser. Answer its questions and download your index.html.">
  <meta property="og:title" content="WebsiteGenerator">
  <meta property="og:description" content="lol.py, a Python script from 2021, running in your browser. Answer its questions and download your index.html.">
  <meta property="og:url" content="https://websitegenerator.bf0.by0.link/">
  <meta name="theme-color" content="#4b3c9d">
  <link rel="icon" href="logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Lexend:wght@400;500&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <h1><img src="logo.webp" alt="WebsiteGenerator" width="720" height="256"></h1>
    <p>The browser version of <code>lol.py</code>, a Python script from June 2021. Answer its questions and your website builds itself next to it.</p>
  </header>

  <main class="desk">
    <section class="win term" aria-label="Terminal">
      <div class="titlebar"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span><span class="title">python3 lol.py</span></div>
      <div class="screen" id="screen">
        <div class="log" id="log" role="log" aria-live="polite"></div>
        <form class="line" id="line" autocomplete="off">
          <label class="ask" id="ask" for="answer"></label>
          <input id="answer" type="text" spellcheck="false" autocapitalize="off" enterkeyhint="send">
        </form>
      </div>
    </section>

    <section class="win browser" aria-label="Preview of your website">
      <div class="titlebar"><span class="lights" aria-hidden="true"><i></i><i></i><i></i></span><span class="address" id="address">example.com</span></div>
      <div class="viewport"><iframe id="preview" title="Your website" sandbox="allow-scripts allow-popups"></iframe></div>
    </section>
  </main>

  <footer class="foot">
    <span>Click any answer in the terminal to change it.</span>
    <span>Part of <a href="https://bf0.by0.link">Back from Zero</a> · <a href="https://github.com/WebsiteGenerator/WebsiteGenerator">Source</a> · <a href="https://github.com/WebsiteGenerator/WebsiteGenerator/tree/main/src">Run it in a real terminal</a></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
