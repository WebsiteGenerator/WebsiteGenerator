<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebsiteGenerator</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-anim"></div>
    
    <div class="container">
        <header>
            <h1>WebsiteGenerator</h1>
            <p>Generate your personal website in seconds.</p>
        </header>

        <main>
            <section class="card-glass">
                <h2>General Information</h2>
                <div class="input-group">
                    <label>Name</label>
                    <input type="text" id="site-name" placeholder="Your Name or Project Name" />
                </div>
                <div class="input-group">
                    <label>Pronouns (optional)</label>
                    <input type="text" id="site-pronouns" placeholder="e.g. he/him" />
                </div>
                <div class="input-group">
                    <label>Description</label>
                    <textarea id="site-desc" rows="3" placeholder="What do you do?"></textarea>
                </div>
                <div class="input-group">
                    <label>Domain</label>
                    <input type="text" id="site-domain" placeholder="example.com" />
                </div>
                <div class="input-group">
                    <label>Profile Picture (URL)</label>
                    <input type="text" id="site-image" placeholder="https://..." />
                </div>
                <div class="input-group">
                    <label>Preview Image / Thumbnail (URL)</label>
                    <input type="text" id="site-thumb" placeholder="https://..." />
                </div>
            </section>

            <section class="card-glass">
                <h2>Cards</h2>
                <p class="section-desc">Add links to your projects or portfolio.</p>
                <div id="cards-container"></div>
                <button class="btn btn-secondary" onclick="addCard()">+ Add Card</button>
            </section>

            <section class="card-glass">
                <h2>Social Media</h2>
                <p class="section-desc">Link your social networks. Use the <a href="https://github.com/WebsiteGenerator/WebsiteGenerator/tree/main/icons" target="_blank">Icon Codes</a> (e.g., 'github', 'twitter').</p>
                <div id="socials-container"></div>
                <button class="btn btn-secondary" onclick="addSocial()">+ Add Icon</button>
            </section>

            <div class="actions">
                <button class="btn btn-primary" onclick="generateWebsite()">Generate & Download</button>
            </div>
        </main>

        <footer>
            <p>Made with WebsiteGenerator</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
